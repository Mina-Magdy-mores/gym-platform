name: FIT CLUB CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  laravel-tests:
    name: Run Pest & Feature Tests (PHP 8.4)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: gym_platform_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup PHP Environment
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, bcmath, zip, gd, pcntl
        coverage: none

    - name: Copy .env
      run: cp .env.example .env

    - name: Install Composer Dependencies
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist --ignore-platform-reqs

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Build Frontend Vite Assets
      run: |
        npm install
        npm run build

    - name: Generate Application Key
      run: php artisan key:generate

    - name: Set Environment Variables for CI
      run: |
        echo "DB_CONNECTION=mysql" >> $GITHUB_ENV
        echo "DB_HOST=127.0.0.1" >> $GITHUB_ENV
        echo "DB_PORT=3306" >> $GITHUB_ENV
        echo "DB_DATABASE=gym_platform_test" >> $GITHUB_ENV
        echo "DB_USERNAME=root" >> $GITHUB_ENV
        echo "DB_PASSWORD=password" >> $GITHUB_ENV
        echo "SESSION_DRIVER=array" >> $GITHUB_ENV
        echo "QUEUE_CONNECTION=sync" >> $GITHUB_ENV
        echo "CACHE_STORE=array" >> $GITHUB_ENV
        echo "FILESYSTEM_DISK=public" >> $GITHUB_ENV

    - name: Run Database Migrations
      run: php artisan migrate --force

    - name: Execute Automated Test Suite
      run: php artisan test --colors=always
